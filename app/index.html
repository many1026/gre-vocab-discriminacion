<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discriminar — GRE</title>
<style>
:root{
  --ground:#14181f;
  --surface:#1c222c;
  --surface-2:#232b36;
  --line:#2e3846;
  --ink:#ece7dd;
  --muted:#8a93a2;
  --faint:#5b6472;
  --lo:#6ea8c9;
  --hi:#d98a4f;
  --right:#86c9a0;
  --wrong:#c97a7a;

  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

.wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}

/* ---------- eyebrow ---------- */
.eyebrow{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;margin-bottom:28px;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);
}
.eyebrow .group-name{color:var(--muted);text-transform:none;letter-spacing:.02em}
.eyebrow b{color:var(--ink);font-weight:500}
.quit{
  background:none;border:none;cursor:pointer;padding:0 0 0 10px;
  font:inherit;color:var(--faint);text-decoration:underline;
}
.quit:hover{color:var(--ink)}

/* ---------- start ---------- */
.hero-word{
  font-family:var(--serif);font-size:clamp(38px,7vw,62px);
  line-height:1.05;letter-spacing:-.02em;margin:0 0 4px;
}
.hero-word .a{color:var(--lo)}
.hero-word .b{color:var(--hi)}
.hero-sub{color:var(--muted);font-size:17px;max-width:46ch;margin:14px 0 0}
.countdown{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin:0 0 18px;
}
.countdown b{color:var(--hi);font-weight:500}
.stat-row{
  display:flex;flex-wrap:wrap;gap:18px 28px;margin:36px 0 32px;padding:18px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--mono);font-size:22px;color:var(--ink)}
.stat .l{font-size:12px;color:var(--faint);letter-spacing:.04em}

.modes{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.mode-btn{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;color:var(--ink);font-family:inherit;font-size:16px;
  transition:border-color .15s,background .15s,transform .15s;
}
.mode-btn:hover{border-color:var(--lo);background:var(--surface-2)}
.mode-btn.wide{border-color:var(--hi);background:var(--surface-2)}
.mode-btn.wide .mt{color:var(--hi)}
.mode-btn .mt{display:block;font-weight:600;margin-bottom:3px}
.mode-btn .md{display:block;color:var(--muted);font-size:14px;line-height:1.4}

/* ---------- question ---------- */
.sentence{
  font-family:var(--serif);font-size:clamp(21px,3.4vw,27px);
  line-height:1.5;margin:0 0 34px;letter-spacing:-.005em;
}
.blank{
  display:inline-block;min-width:5.5ch;border-bottom:2px solid var(--hi);
  text-align:center;color:var(--hi);font-style:italic;
}
.blank.filled{border-bottom-color:transparent;font-style:normal;color:var(--right)}
.prompt-def{
  font-family:var(--serif);font-size:clamp(22px,3.6vw,30px);
  line-height:1.35;margin:0 0 10px;
}
.prompt-tag{
  font-family:var(--mono);font-size:11px;color:var(--faint);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:30px;
}

.options{display:flex;flex-wrap:wrap;gap:9px}
.opt{
  cursor:pointer;font-family:var(--serif);font-size:19px;
  background:transparent;color:var(--ink);
  border:1px solid var(--line);border-radius:8px;
  padding:11px 17px;transition:border-color .12s,background .12s,color .12s;
  display:flex;align-items:baseline;gap:9px;
}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-size:10px;color:var(--faint)}
.opt.is-right{border-color:var(--right);color:var(--right)}
.opt.is-wrong{border-color:var(--wrong);color:var(--wrong)}
.opt.is-dim{opacity:.38}
.opt.is-picked{border-color:var(--ink);background:var(--surface-2)}

/* ---------- TC de dos huecos: una columna por hueco ---------- */
.tc2-cols{display:flex;gap:26px;flex-wrap:wrap}
.tc2-col{flex:1 1 200px;min-width:0}
.tc2-head{
  display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;
}
.tc2-col .options{flex-direction:column;align-items:stretch}
.tc2-col .opt{justify-content:flex-start}

/* ---------- escribir ---------- */
.type-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.type-in{
  flex:1 1 240px;font-family:var(--serif);font-size:21px;
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:12px 15px;
}
.type-in:focus{outline:none;border-color:var(--ink)}
.typed-back{font-family:var(--serif);font-size:23px;margin:4px 0 0}
.typed-back.is-right{color:var(--right)}
.typed-back.is-wrong{color:var(--wrong)}

/* polos del eje mostrados sin riel, en el ejercicio de intensidad */
.rail-poles.rail-poles-solo{margin-bottom:22px}

/* ---------- axis rail (signature) ---------- */
.rail-block{margin:38px 0 30px}
.rail-poles{
  display:flex;justify-content:space-between;gap:20px;
  font-size:12.5px;color:var(--muted);line-height:1.35;margin-bottom:26px;
}
.rail-poles span{max-width:44%}
.rail-poles .p-lo{color:var(--lo)}
.rail-poles .p-hi{color:var(--hi);text-align:right}
.rail{
  position:relative;height:2px;
  background:linear-gradient(90deg,var(--lo),var(--hi));
  border-radius:2px;margin-bottom:8px;
}
.pin{position:absolute;top:50%;transform:translate(-50%,-50%)}
.pin .dot{
  display:block;
  width:9px;height:9px;border-radius:50%;background:var(--faint);
  border:2px solid var(--ground);
}
.pin.right .dot{background:var(--right);width:13px;height:13px;box-shadow:0 0 0 3px rgba(134,201,160,.2)}
.pin.chosen .dot{background:var(--wrong);width:13px;height:13px;box-shadow:0 0 0 3px rgba(201,122,122,.2)}
.pin .lab{
  position:absolute;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:10.5px;white-space:nowrap;color:var(--faint);
}
.pin.up .lab{bottom:16px}
.pin.down .lab{top:16px}
.pin.right .lab{color:var(--right)}
.pin.chosen .lab{color:var(--wrong)}
.rail-spacer{height:44px}
.loose-note{
  font-size:13px;color:var(--faint);font-style:italic;
  border-left:2px solid var(--line);padding-left:12px;margin:30px 0;
}

/* ---------- feedback ---------- */
.fb{margin-top:6px;border-top:1px solid var(--line);padding-top:24px}
.fb-word{
  font-family:var(--serif);font-size:27px;margin:0 0 2px;
  display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;
}
.fb-word .pos{font-family:var(--mono);font-size:11px;color:var(--faint)}
.fb-def{color:var(--ink);margin:0 0 16px;font-size:16.5px}
.fb-disc{color:var(--muted);font-size:15px;line-height:1.62;margin:0 0 20px}
.fb-disc b{color:var(--ink);font-weight:600}
.fb-disc i{color:var(--hi);font-style:normal;font-family:var(--mono);font-size:13.5px}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-left:2px solid var(--wrong);border-radius:0 8px 8px 0;
  padding:14px 16px;margin:0 0 18px;
}
.card.root{border-left-color:var(--lo)}
.card.sense2{border-left-color:var(--hi)}
.card h4{
  margin:0 0 6px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500;
}
.card p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.6}
.card p b{color:var(--ink);font-weight:600}
.card p i{color:var(--hi);font-style:normal;font-family:var(--mono);font-size:13px}

.next-row{display:flex;align-items:center;gap:16px;margin-top:26px}
.btn{
  cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;
  background:var(--ink);color:var(--ground);border:none;border-radius:8px;
  padding:12px 24px;transition:opacity .15s;
}
.btn:hover{opacity:.86}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink);opacity:1}
.hint{font-family:var(--mono);font-size:11px;color:var(--faint)}

/* ---------- summary ---------- */
.score{font-family:var(--serif);font-size:64px;line-height:1;margin:0 0 6px}
.score small{font-size:26px;color:var(--faint)}
.miss-list{list-style:none;padding:0;margin:26px 0 0;border-top:1px solid var(--line)}
.miss-list li{
  padding:13px 0;border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
}
.miss-list .w{font-family:var(--serif);font-size:18px;color:var(--right)}
.miss-list .x{font-family:var(--serif);font-size:18px;color:var(--wrong);text-decoration:line-through;opacity:.75}
.miss-list .g{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}

:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){
  .wrap{padding:22px 16px 60px}
  .rail-poles{font-size:11.5px}
  .pin .lab{font-size:9.5px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="../data/data.js"></script>
<script>
(function(){
"use strict";

var DATA = window.VOCAB;
var app = document.getElementById('app');
var STORE_KEY = 'gre-discriminar-v1';
var SESSION_LEN = 12;
var SATURDAY_LEN = 18;
var DAY = 86400000;
var BOXES = [0, 1, 3, 7, 16];   // días hasta el próximo repaso, por caja
var PAIR_CLEARED = 2;           // aciertos contrastivos seguidos para cerrar un par
var MASTERY_BOX = 3;            // caja mínima (7 días) para considerar asentada una palabra
var EXAM_DATE = new Date(2026, 9, 23);   // 23 de octubre de 2026

function daysToExam(){
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.round((EXAM_DATE - hoy) / DAY);
}

/* ---------- progreso ----------
   store = { words:{palabra:{r,w,t,box,due}}, pairs:{"objetivo>elegida":{n,ok}} }

   La matriz de pares es dirigida a propósito: elegir alleviate cuando tocaba
   assuage no es el mismo error que el inverso, y el contrastivo forzado
   necesita saber en qué dirección se cae.
   loadStore migra los dos formatos anteriores; nunca se pierde progreso. */
function loadStore(){
  var raw;
  try { raw = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ raw = {}; }
  if (!raw.words) raw = {words:raw, pairs:{}};        // v1: mapa plano de palabras
  if (!raw.pairs) raw.pairs = {};
  Object.keys(raw.words).forEach(function(k){         // v1/v2: sin cajas Leitner
    var r = raw.words[k];
    if (typeof r.box !== 'number'){
      r.box = (r.w > 0 || !r.r) ? 0 : 1;
      r.due = r.t || 0;                               // vencida: entra en el próximo repaso
    }
  });
  Object.keys(raw.pairs).forEach(function(k){         // v2: el par era un contador suelto
    if (typeof raw.pairs[k] === 'number') raw.pairs[k] = {n:raw.pairs[k], ok:0};
  });
  return raw;
}
function saveStore(s){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e){}
}
var store = loadStore();

function record(word, ok, pick){
  var r = store.words[word] || {r:0,w:0,t:0,box:0,due:0};
  if (ok){ r.r++; r.box = Math.min(r.box + 1, BOXES.length - 1); }
  else   { r.w++; r.box = 0; }                        // fallar devuelve a la caja 0
  r.t = Date.now();
  r.due = r.t + BOXES[r.box] * DAY;
  store.words[word] = r;
  if (!ok && pick){
    var k = word + '>' + pick;
    var p = store.pairs[k] || {n:0, ok:0};
    p.n++; p.ok = 0;                                  // el par vuelve a abrirse
    store.pairs[k] = p;
  }
  saveStore(store);
}

// Un acierto en contrastivo abona las DOS direcciones: lo que se resuelve es el par.
function recordContrast(target, other, ok, pick){
  record(target, ok, ok ? null : pick);
  if (ok){
    [target + '>' + other, other + '>' + target].forEach(function(k){
      if (store.pairs[k]) store.pairs[k].ok++;
    });
    saveStore(store);
  }
}

function openPair(target, pick){
  var k = target + '>' + pick;
  var p = store.pairs[k] || {n:0, ok:0};
  p.n++; p.ok = 0;
  store.pairs[k] = p;
}

// Ordenar por intensidad: si invirtió dos, ese par se abre — son hermanas del mismo grupo.
function recordOrder(ladder, seq){
  var ok = seq.every(function(w, i){ return w === ladder[i].w; });
  ladder.forEach(function(w){ record(w.w, ok, null); });
  if (!ok){
    for (var i = 0; i < seq.length; i++){
      if (seq[i] !== ladder[i].w){ openPair(ladder[i].w, seq[i]); break; }
    }
    saveStore(store);
  }
  return ok;
}

/* Equivalencia: solo se abre un par cuando la elegida y la correcta son hermanas.
   La matriz de confusión vive dentro del grupo — un par entre grupos distintos no
   tendría contrastivo que lo cerrara con sentido. */
// TC: una sola respuesta. Mismo criterio de pares que SE — solo si son hermanas.
function recordTC(item, pick){
  var right = item.answer[0];
  var ok = pick === right;
  if (ENTRY[right]) record(right, ok, null);
  if (!ok && ENTRY[pick] && ENTRY[right] && ENTRY[pick].g.id === ENTRY[right].g.id){
    openPair(right, pick);
    saveStore(store);
  }
  return ok;
}

/* TC de dos huecos: cada columna se corrige por separado, como en el examen,
   pero el ítem solo cuenta como acertado si las dos caen. */
function recordTC2(item, picks){
  var ok = true;
  item.answer.forEach(function(right, i){
    var hit = picks[i] === right;
    if (!hit) ok = false;
    if (ENTRY[right]) record(right, hit, null);
    if (!hit && ENTRY[picks[i]] && ENTRY[right] &&
        ENTRY[picks[i]].g.id === ENTRY[right].g.id) openPair(right, picks[i]);
  });
  saveStore(store);
  return ok;
}

function recordSE(item, picks){
  var ok = picks.length === 2 && picks.every(function(p){ return item.answer.indexOf(p) >= 0; });
  item.answer.forEach(function(w){ if (ENTRY[w]) record(w, ok, null); });
  if (!ok){
    picks.forEach(function(p){
      if (item.answer.indexOf(p) >= 0) return;
      item.answer.forEach(function(a){
        if (ENTRY[p] && ENTRY[a] && ENTRY[p].g.id === ENTRY[a].g.id) openPair(a, p);
      });
    });
    saveStore(store);
  }
  return ok;
}

// pares que ya se confundieron y todavía no se han resuelto, del más confundido al menos
function openPairs(){
  var out = [];
  Object.keys(store.pairs).forEach(function(k){
    var p = store.pairs[k], ab = k.split('>');
    if (p.n > 0 && p.ok < PAIR_CLEARED && ENTRY[ab[0]] && ENTRY[ab[1]])
      out.push({target:ab[0], other:ab[1], n:p.n, ok:p.ok});
  });
  // Un par a medio cerrar va PRIMERO: está a un acierto de resolverse, y si se hunde
  // bajo los pares recién fallados no se cierra nunca (se pierde el trabajo hecho).
  out.sort(function(a,b){
    var started = (b.ok > 0 ? 1 : 0) - (a.ok > 0 ? 1 : 0);
    return started || (b.n - a.n);
  });
  return out;
}

/* Un grupo NO se domina por promedio de aciertos: hace falta que todas sus palabras
   estén asentadas y que no quede ningún par suyo abierto. (restricción 7) */
function groupMastery(g){
  var names = g.words.map(function(w){ return w.w; });
  var settled = names.every(function(n){
    var r = store.words[n];
    return r && r.box >= MASTERY_BOX;
  });
  var open = openPairs().filter(function(p){
    return names.indexOf(p.target) >= 0 && names.indexOf(p.other) >= 0;
  }).length;
  return {mastered: settled && open === 0, settled: settled, openPairs: open};
}

/* ---------- pool ---------- */
var POOL = [];
var ENTRY = {};
DATA.groups.forEach(function(g){
  g.words.forEach(function(w){
    var e = {w:w, g:g};
    POOL.push(e);
    ENTRY[w.w] = e;
  });
});

// Sentence Equivalence: solo del banco auténtico. No se pueden fabricar desde los
// grupos — cada `ej` está construido para que encaje UNA sola palabra, que es lo
// contrario de lo que pide SE (dos que dejan la oración con el mismo sentido).
var SE_POOL = (DATA.tcBank || []).filter(function(i){
  return i.type === 'SE' && i.options && i.answer && i.answer.length === 2;
});

// Text Completion de un hueco: la vía por la que se estudian las palabras que no
// están en ningún grupo — no necesitan campo semántico ni hermanas, solo cinco
// opciones impresas entre las que una encaja.
var TC_POOL = (DATA.tcBank || []).filter(function(i){
  return i.type === 'TC1' && i.options && i.answer && i.answer.length === 1;
});

// TC de dos huecos: una columna de opciones por hueco, como en el examen.
var TC2_POOL = (DATA.tcBank || []).filter(function(i){
  return i.type === 'TC2' && i.optionGroups && i.optionGroups.length === 2 &&
         i.answer && i.answer.length === 2;
});

// Ordenar por intensidad: hace falta un eje real y cuatro posiciones distintas.
var ORDER_POOL = DATA.groups.filter(function(g){
  if (g.loose || g.words.length < 4) return false;
  var seen = {};
  return g.words.filter(function(w){
    if (seen[w.axisPos]) return false;
    seen[w.axisPos] = 1; return true;
  }).length >= 4;
});

function weightOf(entry){
  var r = store.words[entry.w.w];
  if (!r) return 4;                                   // sin ver: prioridad alta
  var overdue = (Date.now() - r.due) / DAY;
  if (overdue < 0) return 0.15;                       // aún no toca: casi nunca
  return 5 + Math.min(overdue, 10) + (r.w > r.r ? 4 : 0);
}

// Reordena para que no haya dos ítems seguidos del mismo grupo (restricción 3).
function spreadByGroup(items){
  var out = [], pool = items.slice(), last = null;
  while (pool.length){
    var i = 0;
    while (i < pool.length && pool[i].g.id === last) i++;
    if (i === pool.length) i = 0;                     // no queda alternativa
    var it = pool.splice(i, 1)[0];
    last = it.g.id;
    out.push(it);
  }
  return out;
}

function drawByWeight(n, mode, skipWords, ignoreDue){
  var bag = POOL.filter(function(e){ return !skipWords[e.w.w]; });
  var chosen = [], usedGroups = {};
  while (chosen.length < n && bag.length){
    var w = new Array(bag.length), total = 0, i;
    for (i=0;i<bag.length;i++){
      w[i] = (ignoreDue ? 1 : weightOf(bag[i])) * (usedGroups[bag[i].g.id] ? 0.25 : 1);
      total += w[i];
    }
    if (total <= 0) break;
    var t = Math.random()*total, acc = 0, hit = -1;
    for (i=0;i<bag.length;i++){
      if (w[i] <= 0) continue;
      acc += w[i];
      hit = i;
      if (acc >= t) break;
    }
    if (hit < 0) break;
    var e = bag.splice(hit, 1)[0];
    usedGroups[e.g.id] = true;
    chosen.push({kind: mode === 'mixed' ? MIXED_KINDS[Math.floor(Math.random()*MIXED_KINDS.length)] : mode,
                 w: e.w, g: e.g, other: null});
  }
  return chosen;
}

var MIXED_KINDS = ['cloze', 'recall', 'type'];

// cuatro palabras del grupo con posiciones distintas, ya ordenadas de menor a mayor
function pickLadder(g){
  var seen = {};
  var uniq = g.words.filter(function(w){
    if (seen[w.axisPos]) return false;
    seen[w.axisPos] = 1; return true;
  });
  return shuffle(uniq).slice(0, 4).sort(function(a, b){ return a.axisPos - b.axisPos; });
}
function seItem(it){
  return {kind:'se', se:it, w:null, other:null,
          g:{id:'se·' + it.id, name:'equivalencia', loose:true, words:[]}};
}
function tcItem(it){
  return {kind:'tc', se:it, w:null, other:null,
          g:{id:'tc·' + it.id, name:'una oración, un hueco', loose:true, words:[]}};
}
function tc2Item(it){
  return {kind:'tc2', se:it, w:null, other:null,
          g:{id:'tc·' + it.id, name:'una oración, dos huecos', loose:true, words:[]}};
}
function orderItem(g){
  return {kind:'order', w:null, other:null, g:g, ladder:pickLadder(g)};
}

/* mode: 'cloze' | 'recall' | 'mixed' | 'saturday'
   En mixto y sábado, los pares abiertos entran solos como contrastivo forzado
   (restricción 6) y ocupan hasta un tercio de la sesión. */
function pickQuestions(n, mode){
  var items = [], taken = {};

  if (mode === 'se')    return shuffle(SE_POOL).slice(0, n).map(seItem);
  if (mode === 'tc'){
    // el modo de lectura mezcla los de un hueco y los de dos, como el examen
    var pool = TC_POOL.map(tcItem).concat(TC2_POOL.map(tc2Item));
    return shuffle(pool).slice(0, n);
  }
  if (mode === 'order') return shuffle(ORDER_POOL).slice(0, n).map(orderItem);

  if (mode === 'mixed' || mode === 'saturday'){
    openPairs().slice(0, Math.ceil(n/3)).forEach(function(p){
      var e = ENTRY[p.target];
      if (!e || taken[p.target]) return;
      taken[p.target] = true;
      items.push({kind:'contrast', w:e.w, g:e.g, other:p.other});
    });
    // el repaso mezcla formatos, no solo grupos: entran equivalencia y escala
    shuffle(SE_POOL).slice(0, Math.min(2, SE_POOL.length)).forEach(function(it){
      items.push(seItem(it));
    });
    shuffle(TC_POOL).slice(0, Math.min(2, TC_POOL.length)).forEach(function(it){
      items.push(tcItem(it));
    });
    if (TC2_POOL.length) items.push(tc2Item(TC2_POOL[Math.floor(Math.random()*TC2_POOL.length)]));
    if (ORDER_POOL.length) items.push(orderItem(ORDER_POOL[Math.floor(Math.random()*ORDER_POOL.length)]));
  }

  var rest = drawByWeight(Math.max(0, n - items.length),
                          mode === 'saturday' ? 'mixed' : mode,
                          taken,
                          mode === 'saturday');   // el sábado no filtra por vencimiento
  return spreadByGroup(items.concat(rest));
}

function dueCount(){
  var now = Date.now(), n = 0;
  POOL.forEach(function(e){
    var r = store.words[e.w.w];
    if (r && r.due <= now) n++;
  });
  return n;
}
function isSaturday(){ return new Date().getDay() === 6; }

/* ---------- helpers ---------- */
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function shuffle(a){
  a = a.slice();
  for (var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
// "___ed the crowd" -> {before, suffix, after}
function splitEj(ej){
  var i = ej.indexOf('___');
  var before = ej.slice(0,i);
  var rest = ej.slice(i+3);
  var m = rest.match(/^[a-z]+/);
  var suffix = m ? m[0] : '';
  return {before:before, suffix:suffix, after:rest.slice(suffix.length)};
}

/* ---------- estado ---------- */
var state = {view:'start', mode:null, qs:[], idx:0, answered:null, picks:[], done:false, results:[]};

// todo lo que es de la pregunta actual y no debe sobrevivir a la siguiente
function resetItem(){
  state.answered = null; state.picks = []; state.done = false;
  cachedOpts = null; stableShuffle = null;
}

function render(){
  if (state.view === 'start')   return renderStart();
  if (state.view === 'quiz')    return renderQuiz();
  if (state.view === 'summary') return renderSummary();
}

/* ---------- pantalla inicial ---------- */
function startSession(mode){
  state.mode = mode;
  state.qs = pickQuestions(mode === 'saturday' ? SATURDAY_LEN : SESSION_LEN, mode);
  state.idx = 0; state.results = [];
  resetItem();
  state.view = 'quiz';
  render();
}

/* ---------- pregunta ---------- */
function currentOptions(){
  var e = state.qs[state.idx];
  // En contrastivo solo salen las dos palabras del par: cara a cara, sin dónde esconderse.
  if (e.kind === 'contrast') return shuffle([e.w.w, e.other]);
  if (e.kind === 'se' || e.kind === 'tc') return shuffle(e.se.options.slice());
  return shuffle(e.g.words.map(function(w){ return w.w; }));
}
var cachedOpts = null;

var KIND_LABEL = {cloze:'discriminar', recall:'reconocer', contrast:'cara a cara',
                  type:'escribir', se:'equivalencia', order:'intensidad',
                  tc:'leer la oración', tc2:'dos huecos'};

function nextRow(){
  return '<div class="next-row"><button class="btn" id="next">' +
         (state.idx + 1 >= state.qs.length ? 'Ver resultado' : 'Siguiente') +
         '</button><span class="hint">enter</span></div>';
}

// El nombre del grupo NO se muestra mientras la pregunta está abierta: decirte
// "aliviar o reducir algo doloroso" antes de que elijas te regala la categoría,
// que es justo la interferencia que esto combate. Aparece al responder.
function headHtml(e, done){
  return '<div class="eyebrow"><span>' +
    (done && e.g && e.g.name
      ? '<b>' + esc(e.g.id) + '</b> · <span class="group-name">' + esc(e.g.name) + '</span>'
      : esc(KIND_LABEL[e.kind] || '')) +
    '</span><span>' + (state.idx+1) + ' / ' + state.qs.length +
    ' <button class="quit" id="quit">salir</button></span></div>';
}

function blankHtml(ej, filled){
  var p = splitEj(ej);
  var mid = filled
    ? '<span class="blank filled">' + esc(filled + p.suffix) + '</span>'
    : '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>' + esc(p.suffix);
  return '<p class="sentence">' + esc(p.before) + mid + esc(p.after) + '</p>';
}

/* --- opción única: cloze, reconocer, contrastivo --- */
function choiceView(e, done){
  var word = e.w, ans = state.answered;
  var body = (e.kind === 'cloze' || e.kind === 'contrast')
    ? (e.kind === 'contrast'
        ? '<p class="prompt-tag">esta la confundiste con <b>' + esc(e.other) + '</b></p>' : '') +
      blankHtml(word.ej, done ? word.w : null)
    : '<p class="prompt-def">' + esc(word.def) + '</p>' +
      '<p class="prompt-tag">' + esc(word.pos) + '</p>';

  var optHtml = cachedOpts.map(function(o, i){
    var cls = 'opt';
    if (done){
      if (o === word.w) cls += ' is-right';
      else if (o === ans) cls += ' is-wrong';
      else cls += ' is-dim';
    }
    return '<button class="' + cls + '" data-w="' + esc(o) + '"' + (done?' disabled':'') + '>' +
             '<span class="k">' + (i+1) + '</span>' + esc(o) + '</button>';
  }).join('');

  return body + '<div class="options">' + optHtml + '</div>' +
         (done ? feedbackHtml(word, e.g, ans) : '');
}

/* --- escribir: producir la palabra sin verla (generation effect) --- */
function typeView(e, done){
  var word = e.w;
  var body = '<p class="prompt-def">' + esc(word.def) + '</p>' +
             '<p class="prompt-tag">' + esc(word.pos) + ' · ' + word.w.length + ' letras</p>';
  if (!done){
    return body + '<div class="type-row">' +
           '<input id="typed" class="type-in" autocomplete="off" autocapitalize="off" ' +
           'autocorrect="off" spellcheck="false" placeholder="escríbela">' +
           '<button class="btn" id="send">Comprobar</button></div>';
  }
  var typed = state.answered || '';
  var ok = typed.toLowerCase().trim() === word.w.toLowerCase();
  return body +
    '<p class="typed-back ' + (ok ? 'is-right' : 'is-wrong') + '">' +
      (typed ? esc(typed) : '<i>en blanco</i>') +
      (ok ? '' : ' → <b>' + esc(word.w) + '</b>') + '</p>' +
    feedbackHtml(word, e.g, typed);
}

/* --- equivalencia (SE): las DOS que dejan la oración con el mismo sentido --- */
function seView(e, done){
  var it = e.se, picks = state.picks;
  var body = blankHtml(it.text, null) +
    '<p class="prompt-tag">elige <b>dos</b> · ' + picks.length + '/2 marcadas</p>';

  var optHtml = cachedOpts.map(function(o, i){
    var cls = 'opt';
    if (done){
      if (it.answer.indexOf(o) >= 0) cls += ' is-right';
      else if (picks.indexOf(o) >= 0) cls += ' is-wrong';
      else cls += ' is-dim';
    } else if (picks.indexOf(o) >= 0) cls += ' is-picked';
    return '<button class="' + cls + '" data-w="' + esc(o) + '"' + (done?' disabled':'') + '>' +
             '<span class="k">' + (i+1) + '</span>' + esc(o) + '</button>';
  }).join('');

  var fb = '';
  if (done){
    fb = '<div class="fb">' +
         '<p class="fb-word">' + esc(it.answer.join('  ·  ')) + '</p>' +
         '<p class="fb-disc">' + it.why + '</p>' +
         (it.trapNote ? '<div class="card"><h4>la trampa</h4><p>' + it.trapNote + '</p></div>' : '') +
         nextRow() + '</div>';
  }
  return body + '<div class="options">' + optHtml + '</div>' + fb;
}

/* --- Text Completion: una oración, un hueco, cinco opciones impresas --- */
function tcView(e, done){
  var it = e.se, pick = state.answered, right = it.answer[0];
  var body = blankHtml(it.text, done ? right : null);

  var optHtml = cachedOpts.map(function(o, i){
    var cls = 'opt';
    if (done){
      if (o === right) cls += ' is-right';
      else if (o === pick) cls += ' is-wrong';
      else cls += ' is-dim';
    }
    return '<button class="' + cls + '" data-w="' + esc(o) + '"' + (done?' disabled':'') + '>' +
             '<span class="k">' + (i+1) + '</span>' + esc(o) + '</button>';
  }).join('');

  var fb = '';
  if (done){
    fb = '<div class="fb">' +
         '<p class="fb-word">' + esc(right) + '</p>' +
         '<p class="fb-disc">' + it.why + '</p>' +
         '<div class="card"><h4>la señal</h4><p>«' + esc(it.signal.word) + '» — ' +
           esc(it.signal.relation) + '. La pista: <i>' + esc(it.clue) + '</i></p></div>' +
         (it.trapNote ? '<div class="card"><h4>la trampa</h4><p>' + it.trapNote + '</p></div>' : '') +
         nextRow() + '</div>';
  }
  return body + '<div class="options">' + optHtml + '</div>' + fb;
}

/* --- TC de dos huecos: una columna de opciones por hueco --- */
function blanks2Html(text, fills){
  var parts = text.split('___'), out = esc(parts[0]);
  for (var i = 1; i < parts.length; i++){
    var f = fills && fills[i-1];
    out += f ? '<span class="blank filled">' + esc(f) + '</span>'
             : '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>';
    out += esc(parts[i]);
  }
  return '<p class="sentence">' + out + '</p>';
}

function tc2View(e, done){
  var it = e.se, picks = state.picks;
  var body = blanks2Html(it.text, done ? it.answer : picks);

  var cols = it.optionGroups.map(function(col, ci){
    var opts = col.map(function(o){
      var cls = 'opt';
      if (done){
        if (o === it.answer[ci]) cls += ' is-right';
        else if (o === picks[ci]) cls += ' is-wrong';
        else cls += ' is-dim';
      } else if (picks[ci] === o) cls += ' is-picked';
      return '<button class="' + cls + '" data-w="' + esc(o) + '" data-col="' + ci + '"' +
             (done?' disabled':'') + '>' + esc(o) + '</button>';
    }).join('');
    return '<div class="tc2-col"><span class="tc2-head">' +
           (ci === 0 ? 'primer hueco' : 'segundo hueco') + '</span>' +
           '<div class="options">' + opts + '</div></div>';
  }).join('');

  var fb = '';
  if (done){
    fb = '<div class="fb">' +
         '<p class="fb-word">' + esc(it.answer.join('  ·  ')) + '</p>' +
         '<p class="fb-disc">' + it.why + '</p>' +
         '<div class="card"><h4>la señal</h4><p>«' + esc(it.signal.word) + '» — ' +
           esc(it.signal.relation) + '. La pista: <i>' + esc(it.clue) + '</i></p></div>' +
         (it.trapNote ? '<div class="card"><h4>la trampa</h4><p>' + it.trapNote + '</p></div>' : '') +
         nextRow() + '</div>';
  }
  return body + '<div class="tc2-cols">' + cols + '</div>' + fb;
}

/* --- ordenar por intensidad: colocar cuatro palabras sobre el eje --- */
function orderView(e, done){
  var g = e.g, picks = state.picks;
  var body = '<p class="prompt-def">Ordénalas de menor a mayor sobre el eje del grupo.</p>' +
             '<div class="rail-poles rail-poles-solo">' +
               '<span class="p-lo">' + esc(g.axis.lo) + '</span>' +
               '<span class="p-hi">' + esc(g.axis.hi) + '</span></div>' +
             '<p class="prompt-tag">' + (picks.length ? esc(picks.join(' → ')) : 'toca la más baja primero') + '</p>';

  var optHtml = shuffleStable(e.ladder).map(function(w, i){
    var cls = 'opt';
    var at = picks.indexOf(w.w);
    if (done){
      cls += (picks[e.ladder.indexOf(w)] === w.w) ? ' is-right' : ' is-wrong';
    } else if (at >= 0) cls += ' is-picked';
    return '<button class="' + cls + '" data-w="' + esc(w.w) + '"' + (done || at >= 0 ? ' disabled' : '') + '>' +
             '<span class="k">' + (at >= 0 ? at+1 : i+1) + '</span>' + esc(w.w) + '</button>';
  }).join('');

  var fb = '';
  if (done){
    var ok = picks.every(function(p, i){ return p === e.ladder[i].w; });
    fb = '<div class="fb">' +
         '<p class="fb-word">' + (ok ? 'orden correcto' : 'el orden real') + '</p>' +
         railHtml(g, null, null) +
         '<p class="fb-disc">' + esc(e.ladder.map(function(w){ return w.w; }).join(' → ')) + '</p>' +
         nextRow() + '</div>';
  }
  return body + '<div class="options">' + optHtml + '</div>' + fb;
}

// mismo barajado durante toda la pregunta: no se reordena al tocar una opción
var stableShuffle = null;
function shuffleStable(arr){
  if (!stableShuffle || stableShuffle.length !== arr.length) stableShuffle = shuffle(arr);
  return stableShuffle;
}

function renderQuiz(){
  var e = state.qs[state.idx];
  var done = state.done;
  if (!done && !cachedOpts && e.kind !== 'order' && e.kind !== 'type' && e.kind !== 'tc2')
    cachedOpts = currentOptions();

  var view = e.kind === 'se'    ? seView(e, done)
           : e.kind === 'tc'    ? tcView(e, done)
           : e.kind === 'tc2'   ? tc2View(e, done)
           : e.kind === 'order' ? orderView(e, done)
           : e.kind === 'type'  ? typeView(e, done)
           :                      choiceView(e, done);

  app.innerHTML = headHtml(e, done) + view;

  // se puede abandonar a media sesión: lo ya respondido queda guardado
  var qb = app.querySelector('#quit');
  if (qb) qb.addEventListener('click', function(){
    state.view = state.results.length ? 'summary' : 'start';
    render();
  });

  if (!done){
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.addEventListener('click', function(){
        answer(b.getAttribute('data-w'), b.getAttribute('data-col'));
      });
    });
    var input = app.querySelector('#typed');
    if (input){
      input.focus();
      app.querySelector('#send').addEventListener('click', function(){ answer(input.value); });
      input.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter'){ ev.preventDefault(); answer(input.value); }
      });
    }
  } else {
    var nb = app.querySelector('#next');
    if (nb){ nb.addEventListener('click', next); nb.focus(); }
  }
}

function finish(e, ok, pick){
  state.done = true;
  state.results.push({word:e.w, group:e.g, pick:pick, ok:ok, kind:e.kind});
  render();
}

function answer(pick, col){
  var e = state.qs[state.idx];

  if (e.kind === 'tc2'){
    state.picks[+col] = pick;
    if (state.picks[0] == null || state.picks[1] == null) return render();
    var okTC2 = recordTC2(e.se, state.picks);
    return finish({w:{w:e.se.answer.join(' + ')}, g:e.g, kind:'tc2'}, okTC2, state.picks.join(' + '));
  }

  if (e.kind === 'se'){
    if (state.picks.indexOf(pick) >= 0) state.picks.splice(state.picks.indexOf(pick), 1);
    else state.picks.push(pick);
    if (state.picks.length < 2) return render();
    var okSE = recordSE(e.se, state.picks);
    return finish({w:{w:e.se.answer.join(' + ')}, g:e.g, kind:'se'}, okSE, state.picks.join(' + '));
  }

  if (e.kind === 'tc'){
    state.answered = pick;
    var okTC = recordTC(e.se, pick);
    return finish({w:{w:e.se.answer[0]}, g:e.g, kind:'tc'}, okTC, pick);
  }

  if (e.kind === 'order'){
    state.picks.push(pick);
    if (state.picks.length < e.ladder.length) return render();
    var okOrd = recordOrder(e.ladder, state.picks);
    return finish({w:{w:e.ladder.map(function(w){ return w.w; }).join(' → ')}, g:e.g, kind:'order'},
                  okOrd, state.picks.join(' → '));
  }

  var ok = e.kind === 'type'
    ? String(pick).toLowerCase().trim() === e.w.w.toLowerCase()
    : pick === e.w.w;
  state.answered = pick;
  if (e.kind === 'contrast')  recordContrast(e.w.w, e.other, ok, pick);
  else if (e.kind === 'type') record(e.w.w, ok, null);   // sin par: no eligió una hermana
  else                        record(e.w.w, ok, pick);
  finish(e, ok, pick);
}

function next(){
  resetItem();
  state.idx++;
  if (state.idx >= state.qs.length) state.view = 'summary';
  render();
}

/* ---------- feedback: el eje ---------- */
function railHtml(group, correct, chosen){
  if (group.loose){
    return '<p class="loose-note">Este grupo no tiene un eje que ordene sus palabras: comparten campo, ' +
           'pero no son grados de una misma escala.</p>';
  }
  var pins = group.words.map(function(w,i){
    var cls = 'pin ' + (i%2 ? 'down' : 'up');
    if (w.w === correct) cls += ' right';
    else if (w.w === chosen) cls += ' chosen';
    return '<span class="' + cls + '" style="left:' + w.axisPos + '%">' +
             '<span class="dot"></span><span class="lab">' + esc(w.w) + '</span>' +
           '</span>';
  }).join('');
  return '<div class="rail-block">' +
           '<div class="rail-poles">' +
             '<span class="p-lo">' + esc(group.axis.lo) + '</span>' +
             '<span class="p-hi">' + esc(group.axis.hi) + '</span>' +
           '</div>' +
           '<div class="rail">' + pins + '</div>' +
           '<div class="rail-spacer"></div>' +
         '</div>';
}

function feedbackHtml(word, group, pick){
  var ok = pick === word.w;
  var html = railHtml(group, word.w, pick);

  html += '<div class="fb">';
  html += '<p class="fb-word">' + esc(word.w) + '<span class="pos">' + esc(word.pos) + '</span></p>';
  html += '<p class="fb-def">' + esc(word.def) + '</p>';
  html += '<p class="fb-disc">' + word.disc + '</p>';

  if (!ok){
    var chosen = null;
    group.words.forEach(function(w){ if (w.w === pick) chosen = w; });
    // ¿la que elegiste es justo su hermana peligrosa?
    if (word.twin === pick && word.whyNotTwin){
      html += '<div class="card"><h4>' + esc(word.w) + ' frente a ' + esc(pick) + '</h4>' +
              '<p>' + word.whyNotTwin + '</p></div>';
    } else if (chosen && chosen.twin === word.w && chosen.whyNotTwin){
      html += '<div class="card"><h4>' + esc(pick) + ' frente a ' + esc(word.w) + '</h4>' +
              '<p>' + chosen.whyNotTwin + '</p></div>';
    } else if (chosen){
      html += '<div class="card"><h4>elegiste ' + esc(pick) + '</h4>' +
              '<p>' + chosen.disc + '</p></div>';
    }
  }

  if (word.polysemous && word.sense2){
    html += '<div class="card sense2"><h4>segundo sentido</h4><p><b>' + esc(word.sense2.def) + '</b> — ' +
            (word.sense2.note || '') + '</p></div>';
  }
  if (word.root){
    html += '<div class="card root"><h4>raíz</h4><p>' + esc(word.root) + '</p></div>';
  }

  html += nextRow();
  html += '</div>';
  return html;
}

/* ---------- resumen ---------- */
function renderSummary(){
  var right = state.results.filter(function(r){ return r.ok; }).length;
  var misses = state.results.filter(function(r){ return !r.ok; });

  var MODE_LABEL = {cloze:'discriminar', recall:'reconocer', type:'escribir', se:'equivalencia',
                    order:'intensidad', tc:'leer la oración', mixed:'repaso del día', saturday:'sábado'};
  var html = '<div class="eyebrow"><span>sesión terminada</span><span>' +
             esc(MODE_LABEL[state.mode] || state.mode) + '</span></div>';
  html += '<p class="score">' + right + '<small> / ' + state.results.length + '</small></p>';

  if (misses.length){
    html += '<p class="hero-sub">Estas se te cruzaron con una vecina. Vuelven en el próximo repaso, ' +
            'y el par queda abierto hasta que lo resuelvas cara a cara.</p>';
    html += '<ul class="miss-list">' + misses.map(function(m){
      return '<li><span class="w">' + esc(m.word.w) + '</span>' +
             '<span class="x">' + esc(m.pick) + '</span>' +
             '<span class="g">' + esc(m.group.id) + '</span></li>';
    }).join('') + '</ul>';
  } else {
    html += '<p class="hero-sub">Pleno. Las palabras suben de caja y tardarán más en volver.</p>';
  }

  var stillOpen = openPairs().length;
  if (stillOpen){
    html += '<p class="hero-sub">Quedan <b>' + stillOpen + '</b> pares abiertos. ' +
            'El repaso del día los pone primero.</p>';
  }

  html += '<div class="next-row">' +
          '<button class="btn" id="again">Otra ronda</button>' +
          '<button class="btn ghost" id="home">Cambiar de modo</button></div>';
  app.innerHTML = html;

  app.querySelector('#again').addEventListener('click', function(){ startSession(state.mode); });
  app.querySelector('#home').addEventListener('click', function(){
    state.view = 'start'; render();
  });
}

/* ---------- teclado ---------- */
document.addEventListener('keydown', function(ev){
  if (state.view !== 'quiz') return;
  if (!state.done){
    // en "escribir" el input necesita los dígitos; ahí no hay atajos numéricos
    if (document.activeElement && document.activeElement.id === 'typed') return;
    var n = parseInt(ev.key,10);
    if (n >= 1 && n <= 9){
      var all = app.querySelectorAll('.opt');
      if (all[n-1] && !all[n-1].disabled) all[n-1].click();
    }
  } else if (ev.key === 'Enter' || ev.key === ' '){
    ev.preventDefault();
    next();
  }
});

render();
})();
</script>
</body>
</html>
